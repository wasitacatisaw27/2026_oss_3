<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정 페이지(오픈소스스튜디오)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



</head>

<!--해당 페이지 목적: 데이터 수정을 위한 FROM 페이지 작성-->
<!--수정 클릭 시 alert로 알림-->

<body>

    <header>

        <h1>정보 수정</h1>


        <nav>
            <a href="index.html">Home</a>

        </nav>
    </header>
    <main>
        <form><!--js는 구현 안함, 껍데기만-->

            <label>수업명</label> <br>
            <input type="text" name="className"placeholder="오픈소스 스튜디오">  <br>
           
            <label>요일</label> <br>
            <input type="text" name="day"placeholder="월요일, 목요일">  <br>

            <label> 교시 </label> <br>
            <input type="text" name="period" placeholder="1-2교시"> <br>

            <label> 교수님</label><br>
            <input type="text" name="professor" placeholder="장소연 교수님"><br>

            <label> 교수님 이메일</label><br>
            <input type="email" name="email" placeholder="jerry1004@handong.edu"><br>

            <label>수업 필기</label> <br>
            <input type="url" name="memo"><br>

            <label> 강의 정보 </label><br>
            <input type="description" placeholder="프론트엔드 웹개발 기초"><br>

            <button type="button" onclick="alert('수정하시겠습니까?')">수정</button>

        </form>

    </main>
</body>
</html>
